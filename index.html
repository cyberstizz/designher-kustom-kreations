<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#150F1A" />
    <title>Designher Kustom Kreations — Hand-Set Bling, Made to Order</title>
    <meta
      name="description"
      content="Hand-set rhinestone and pearl customs on sneakers, boots, denim and more. Made to order by Dianna Beaty in Laurelton, Queens. Shipping nationwide."
    />

    <meta property="og:title" content="Designher Kustom Kreations" />
    <meta property="og:description" content="Hand-set bling, made to order. Shipping nationwide from Laurelton, Queens." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/kreation-01.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms detection stub.
         Netlify scans the built HTML at deploy time to discover forms. A React
         app renders its form in JavaScript, which the scanner never sees, so
         this hidden static copy is what registers the form and its fields.
         Every field the app submits must appear here, or Netlify drops it.
         Do not delete this, and keep the field names in sync with
         src/pages/scripts/custom.js. -->
    <form name="custom-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="base" />
      <input type="text" name="occasion" />
      <input type="text" name="palette" />
      <textarea name="personalization"></textarea>
      <input type="text" name="size" />
      <input type="text" name="timeline" />
      <input type="text" name="budget" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="shipState" />
      <input type="text" name="referencePhoto" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
